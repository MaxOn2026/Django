[project]
name = "django-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maxim", email = "vanvanov14@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "model-bakery>=1.24.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[project.scripts]
django-testing = "django_testing:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
